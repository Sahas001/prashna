# Builds Radar for every platform when a version tag (v1.2.3) is pushed.
# Runs free on GitHub Actions; see .github/workflows/release.yml.
version: 2
project_name: radar

builds:
  - main: ./cmd/radar
    binary: radar
    env: [CGO_ENABLED=0] # pure-Go SQLite: one static binary, no system libraries
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - name_template: "radar_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
