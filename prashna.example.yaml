# Optional settings for Prashna.
#
# Prashna works without any config file. Most settings (sources, edition
# size, learning) are changed on the Settings page, and interests, feeds
# and authors on their own pages. This file is for the rest.
#
# To use it, copy it to config.yaml in Prashna's data folder:
#   Linux:   ~/.config/prashna/config.yaml
#   macOS:   ~/Library/Application Support/Prashna/config.yaml
#   Windows: %AppData%\Prashna\config.yaml
# (or wherever -data / $PRASHNA_HOME points). Every key is optional.

# Where the app listens. The default only accepts connections from this
# computer. To read on your phone over your home network or Tailscale, use
# 0.0.0.0:7878; Prashna then asks for a password, read from this variable:
# addr: 127.0.0.1:7878
# password_env: PRASHNA_PASSWORD

# How often sources are checked while Prashna runs (the Settings page
# changes this too).
# fetch_every: 4h

# Identify Prashna politely to the sites it reads.
# user_agent: "Prashna/1.0 (personal reading app)"

sources:
  hackernews:
    lookback: 48h
    max_results: 150
  arxiv:
    max_results: 200
  rss:
    # Skip posts older than this, so following a blog doesn't import its archive.
    max_age: 720h
  books:
    # Book catalogues change slowly: check once a day.
    every: 24h
    language: en

edition:
  min_score: 0.05
  # Only things found in the last week make it into an edition.
  lookback: 168h
  books:
    pick_of_week: true
    new_releases: 4
    # How recent a followed author's book must be to count as new.
    new_release_window: 8760h

scoring:
  # score = keyword·match + similarity·(likeness to what you liked) + recency
  weights:
    keyword: 0.5
    similarity: 0.3
    recency: 0.2
  half_life:
    paper: 72h
    article: 96h
    news: 24h
    book: 26280h

learning:
  min_ratings: 20
  max_weight: 0.8

# Interests, feeds and authors listed here are imported once, the first time
# Prashna runs with a new data folder. After that, edit them in the app.
# interests:
#   - distributed systems
#   - term: cryptocurrency
#     weight: -1
