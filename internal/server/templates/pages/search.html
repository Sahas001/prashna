{{define "content"}}
<header class="page-head">
  <h1>Search</h1>
  <p class="dek">Find anything Radar has brought you: titles, summaries, authors, tags.</p>
</header>
<form class="search-form" action="/search" method="get" role="search">
  <label class="sr-only" for="q">Search</label>
  <input id="q" type="search" name="q" value="{{.Query}}" placeholder="Search your reading" autocomplete="off" autofocus
    hx-get="/search" hx-trigger="input changed delay:300ms, search" hx-target="#results" hx-swap="outerHTML" hx-push-url="true">
  <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
</form>
{{template "search-results" .}}
{{end}}
