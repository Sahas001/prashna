{{define "content"}}
<div class="page-head">
  <h1>Reading list</h1>
  <p class="sub">Saved for later. Unread first. Available offline once you've opened this page with the app installed.</p>
</div>
{{- if .}}
<div class="cards">
  {{- range .}}{{template "card" .}}{{end}}
</div>
{{- else}}
<div class="empty">
  <h2>Nothing saved yet</h2>
  <p>Tap <strong>Save</strong> on anything in <a href="/">Today</a> to read it later.</p>
</div>
{{- end}}
{{end}}
